name: Build macOS apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up private Python and build native app
        env:
          MUSICA_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: bash ./生成Mac应用.command
      - uses: actions/upload-artifact@v4
        with:
          name: MusicaMac-${{ matrix.architecture }}
          path: releases/
          if-no-files-found: error
